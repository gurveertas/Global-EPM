# One nginx for every eszy host.
# Every host gets the same React app, which picks what to show from the hostname:
#   eszy.com, www.eszy.com     -> marketing site
#   admin.eszy.com             -> platform console
#   <company>.eszy.com, custom -> company panel
# /api goes to the API on every host; the API finds the company from the Host header.
# TLS: terminate at a load balancer (AWS ALB with an ACM wildcard certificate for *.eszy.com), or add
# certificates here (a wildcard certificate needs the DNS challenge, e.g. certbot --dns-route53).

upstream eszy_api { server api:4000; keepalive 32; }

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 10m;
  root /srv/app;

  location /api/ {
    proxy_pass http://eszy_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health { proxy_pass http://eszy_api; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
