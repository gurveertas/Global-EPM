# Runs all of eszy on one machine: PostgreSQL, Redis, API, worker and the web front.
#   cp .env.example .env   (fill in secrets and passwords)
#   docker compose up -d --build
#   docker compose run --rm migrate
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eszy
      POSTGRES_USER: eszy_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD}
      ESZY_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eszy_owner -d eszy"], interval: 5s, retries: 20 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped
  migrate:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    command: ["sh", "-c", "node dist/migrate.js && node dist/seed.js"]
    depends_on: { postgres: { condition: service_healthy } }
    profiles: ["tools"]
  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    env_file: .env
    command: ["node", "dist/worker.js"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: infra/Dockerfile.web }
    environment: { BASE_DOMAIN: "${BASE_DOMAIN:-eszy.com}" }
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped
volumes: { pgdata: {}, redisdata: {} }
